<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Resultado do júri simulado</title>
  <desc id="desc">Representação do resultado com nota do processo, fontes de avaliação, ajuste entre pares e média final.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14213d" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#eef3f8"/><rect x="100" y="38" width="1000" height="624" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="148" y="89" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Desempenho — Júri Simulado</text><rect x="900" y="64" width="152" height="31" rx="15" fill="#e7eef8"/><text x="976" y="85" text-anchor="middle" fill="#1d4b85" font-family="Arial,sans-serif" font-size="12" font-weight="700">Grupo 3 · Acusação</text>
  <rect x="148" y="124" width="904" height="130" rx="14" fill="#f6f8fb" stroke="#e1e8f1"/><text x="180" y="158" fill="#64748b" font-family="Arial,sans-serif" font-size="12">MÉDIA DO JÚRI SIMULADO</text><text x="180" y="221" fill="#0d2b58" font-family="Arial,sans-serif" font-size="56" font-weight="700">8,2</text><text x="292" y="215" fill="#64748b" font-family="Arial,sans-serif" font-size="16">/ 10</text><text x="452" y="172" fill="#334b6b" font-family="Arial,sans-serif" font-size="12">Processo 01: 8,0</text><text x="452" y="198" fill="#334b6b" font-family="Arial,sans-serif" font-size="12">Processo 02: 8,4</text><text x="452" y="224" fill="#19734b" font-family="Arial,sans-serif" font-size="12">Avaliação entre pares: +0,2</text>
  <text x="148" y="302" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Como o processo foi avaliado</text><g font-family="Arial,sans-serif" font-size="12"><rect x="148" y="326" width="276" height="94" rx="12" fill="#fff0ef" stroke="#efc7c2"/><text x="174" y="356" fill="#a83e3e" font-weight="700">Juiz</text><text x="174" y="388" fill="#334b6b" font-size="27" font-weight="700">8,0 / 10</text><rect x="444" y="326" width="276" height="94" rx="12" fill="#eaf1fb" stroke="#cbd9eb"/><text x="470" y="356" fill="#1d4b85" font-weight="700">Professor</text><text x="470" y="388" fill="#334b6b" font-size="27" font-weight="700">8,4 / 10</text><rect x="740" y="326" width="312" height="94" rx="12" fill="#fff7df" stroke="#efd58e"/><text x="766" y="356" fill="#a56a05" font-weight="700">IA · argumentação</text><text x="766" y="388" fill="#334b6b" font-size="27" font-weight="700">8,1 / 10</text></g>
  <rect x="148" y="460" width="904" height="102" rx="12" fill="#eef8f2" stroke="#bfe6cf"/><text x="178" y="494" fill="#19734b" font-family="Arial,sans-serif" font-size="14" font-weight="700">Nota individual</text><text x="178" y="522" fill="#4a6e5b" font-family="Arial,sans-serif" font-size="12">A nota-base do processo é a nota do grupo. A avaliação entre pares pode ajustar até ±1 ponto.</text><text x="178" y="545" fill="#4a6e5b" font-family="Arial,sans-serif" font-size="12">Falta recebe 0; participação justificada pode não entrar na média, conforme registro docente.</text>
  <text x="600" y="686" text-anchor="middle" fill="#60738e" font-family="Arial,sans-serif" font-size="12">Representação da tela do sistema • a média considera os processos que contam para o aluno</text>
</svg>
