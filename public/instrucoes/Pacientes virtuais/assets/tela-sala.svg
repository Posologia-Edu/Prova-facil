<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Sala virtual de paciente</title>
  <desc id="desc">Representação da sala virtual com identificação do paciente, encontro atual, conversa e campo de mensagem.</desc>
