<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Formulário MAI</title>
  <desc id="desc">Representação do formulário de avaliação MAI com medicamento e critérios de adequação.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1d3557" flood-opacity=".24"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#dfe8f3"/>
  <rect x="184" y="38" width="832" height="624" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="226" y="88" fill="#0b1d3a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Medication Appropriateness Index (MAI)</text>
  <text x="226" y="116" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Avalie cada medicamento em uso. Todos os 10 critérios devem ser preenchidos.</text>
  <line x1="226" y1="138" x2="974" y2="138" stroke="#e2e8f0"/>
  <rect x="226" y="160" width="748" height="54" rx="10" fill="#f0f4f9"/>
  <circle cx="254" cy="187" r="12" fill="#dbeafe"/><path d="M248 187h12M254 181v12" stroke="#1d4b85" stroke-width="2"/>
  <text x="278" y="192" fill="#213754" font-family="Arial, sans-serif" font-size="15" font-weight="700">Medicamento 1 — Ibuprofeno 400 mg</text>
  <rect x="885" y="175" width="65" height="25" rx="12" fill="#e0f2e9"/><text x="917" y="192" text-anchor="middle" fill="#19734b" font-family="Arial, sans-serif" font-size="11" font-weight="700">10/10</text>
  <text x="226" y="252" fill="#1e334f" font-family="Arial, sans-serif" font-size="14" font-weight="700">1. Indicação</text>
  <text x="226" y="274" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Existe indicação para o medicamento?</text>
  <circle cx="246" cy="304" r="8" fill="#0d2b58"/><circle cx="246" cy="304" r="3" fill="#fff"/><text x="264" y="309" fill="#1e334f" font-family="Arial, sans-serif" font-size="12">Apropriado</text>
  <circle cx="407" cy="304" r="8" fill="#fff" stroke="#9aa9bc" stroke-width="2"/><text x="425" y="309" fill="#1e334f" font-family="Arial, sans-serif" font-size="12">Marginalmente apropriado</text>
  <circle cx="625" cy="304" r="8" fill="#fff" stroke="#9aa9bc" stroke-width="2"/><text x="643" y="309" fill="#1e334f" font-family="Arial, sans-serif" font-size="12">Inapropriado</text>
  <line x1="226" y1="329" x2="974" y2="329" stroke="#e9eef5"/>
  <text x="226" y="366" fill="#1e334f" font-family="Arial, sans-serif" font-size="14" font-weight="700">2. Efetividade</text>
  <text x="226" y="388" fill="#64748b" font-family="Arial, sans-serif" font-size="12">O medicamento é efetivo para a condição?</text>
  <circle cx="246" cy="418" r="8" fill="#fff" stroke="#9aa9bc" stroke-width="2"/><text x="264" y="423" fill="#1e334f" font-family="Arial, sans-serif" font-size="12">Apropriado</text>
  <circle cx="407" cy="418" r="8" fill="#0d2b58"/><circle cx="407" cy="418" r="3" fill="#fff"/><text x="425" y="423" fill="#1e334f" font-family="Arial, sans-serif" font-size="12">Marginalmente apropriado</text>
  <circle cx="625" cy="418" r="8" fill="#fff" stroke="#9aa9bc" stroke-width="2"/><text x="643" y="423" fill="#1e334f" font-family="Arial, sans-serif" font-size="12">Inapropriado</text>
  <rect x="226" y="470" width="354" height="52" rx="9" fill="#fff" stroke="#d3dce8"/><text x="250" y="501" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Critérios 3 a 10 preenchidos</text><text x="542" y="501" text-anchor="end" fill="#1d4b85" font-family="Arial, sans-serif" font-size="12" font-weight="700">8/10</text>
  <rect x="226" y="550" width="748" height="48" rx="9" fill="#0d2b58"/><text x="600" y="580" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Enviar avaliação MAI (1 medicamento)</text>
  <text x="600" y="686" text-anchor="middle" fill="#60738e" font-family="Arial, sans-serif" font-size="12">Representação da tela do sistema • o envio conclui o atendimento</text>
</svg>
