<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Acesso ao júri simulado</title>
  <desc id="desc">Representação da tela de acesso do aluno com e-mails, PIN e entrada na atividade.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset="1" stop-color="#132d5c"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06132b" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/><circle cx="1040" cy="100" r="180" fill="#244a88" opacity=".35"/><circle cx="118" cy="620" r="220" fill="#d6911a" opacity=".14"/>
  <rect x="350" y="48" width="500" height="604" rx="22" fill="#fff" filter="url(#shadow)"/>
  <circle cx="600" cy="112" r="29" fill="#e5a31b"/><path d="M600 94v36M582 112h36" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="174" text-anchor="middle" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Portal do aluno</text>
  <text x="600" y="202" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Acesse seu Júri Simulado</text>
  <rect x="394" y="230" width="412" height="36" rx="8" fill="#f1f5fa"/><rect x="398" y="234" width="198" height="28" rx="6" fill="#0d2b58"/><text x="497" y="253" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Individual</text><text x="701" y="253" text-anchor="middle" fill="#566b86" font-family="Arial,sans-serif" font-size="12" font-weight="700">Em grupo</text>
  <text x="394" y="304" fill="#172b4d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Seu e-mail</text><rect x="394" y="316" width="412" height="48" rx="9" fill="#f8fafc" stroke="#d4dce8"/><text x="418" y="346" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">seu.nome@instituicao.edu.br</text>
  <text x="394" y="402" fill="#172b4d" font-family="Arial,sans-serif" font-size="13" font-weight="700">PIN da atividade</text><rect x="394" y="414" width="412" height="48" rx="9" fill="#f8fafc" stroke="#d4dce8"/><text x="600" y="445" text-anchor="middle" fill="#718096" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">ABC123</text>
  <rect x="394" y="492" width="412" height="50" rx="9" fill="#0d2b58"/><text x="600" y="523" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Entrar na atividade</text>
  <rect x="394" y="566" width="412" height="42" rx="9" fill="#fff9e9" stroke="#f2d28b"/><text x="600" y="592" text-anchor="middle" fill="#855b06" font-family="Arial,sans-serif" font-size="11">No modo grupo, informe os e-mails de todos os integrantes.</text>
  <text x="600" y="684" text-anchor="middle" fill="#cbd8ec" font-family="Arial,sans-serif" font-size="12">Representação da tela do sistema • acesso por PIN e e-mail</text>
</svg>
