  <rect x="278" y="80" width="51" height="22" rx="11" fill="#e7eef8"/><text x="303" y="95" text-anchor="middle" fill="#1d4b85" font-family="Arial, sans-serif" font-size="11" font-weight="700">Dor</text>
  <rect x="339" y="80" width="228" height="22" rx="11" fill="#fff3cc"/><text x="453" y="95" text-anchor="middle" fill="#855b06" font-family="Arial, sans-serif" font-size="11" font-weight="700">1º Encontro — Anamnese inicial</text>
  <rect x="922" y="58" width="190" height="38" rx="8" fill="#f7f9fc" stroke="#d6dfec"/><text x="1017" y="82" text-anchor="middle" fill="#39506f" font-family="Arial, sans-serif" font-size="12" font-weight="700">Avançar encontro  ›</text>
