<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tela de feedback e nota</title>
  <desc id="desc">Representação da tela de feedback com nota final, detalhamento por critérios e orientações de melhoria.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14213d" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#eef3f8"/>
  <rect x="100" y="38" width="1000" height="624" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="148" y="90" fill="#0b1d3a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Resultado do atendimento</text>
  <rect x="900" y="65" width="148" height="32" rx="16" fill="#e7eef8"/><text x="974" y="86" text-anchor="middle" fill="#1d4b85" font-family="Arial, sans-serif" font-size="12" font-weight="700">Dona Helena</text>
  <rect x="148" y="124" width="904" height="136" rx="14" fill="#f6f8fb" stroke="#e1e8f1"/>
  <text x="180" y="160" fill="#64748b" font-family="Arial, sans-serif" font-size="13">NOTA FINAL DO ATENDIMENTO</text>
  <text x="180" y="224" fill="#0d2b58" font-family="Arial, sans-serif" font-size="60" font-weight="700">8,4</text><text x="292" y="218" fill="#64748b" font-family="Arial, sans-serif" font-size="16">/ 10</text>
  <text x="440" y="176" fill="#334b6b" font-family="Arial, sans-serif" font-size="12">Base: 7,80</text><text x="440" y="200" fill="#19734b" font-family="Arial, sans-serif" font-size="12">+ Bônus de eficiência clínica: 0,60</text><text x="440" y="224" fill="#334b6b" font-family="Arial, sans-serif" font-size="12">Eficiência clínica: 3,0 / 5</text>
  <text x="148" y="306" fill="#0b1d3a" font-family="Arial, sans-serif" font-size="16" font-weight="700">Detalhamento por critério</text>
  <g font-family="Arial, sans-serif" font-size="12"><rect x="148" y="326" width="432" height="38" rx="8" fill="#f6f8fb"/><text x="166" y="350" fill="#334b6b">Identificação e acolhimento</text><text x="548" y="350" text-anchor="end" fill="#0d2b58" font-weight="700">0,90 / 1</text><rect x="148" y="374" width="432" height="38" rx="8" fill="#f6f8fb"/><text x="166" y="398" fill="#334b6b">Queixa principal / HDA</text><text x="548" y="398" text-anchor="end" fill="#0d2b58" font-weight="700">0,80 / 1</text><rect x="148" y="422" width="432" height="38" rx="8" fill="#f6f8fb"/><text x="166" y="446" fill="#334b6b">História medicamentosa</text><text x="548" y="446" text-anchor="end" fill="#0d2b58" font-weight="700">0,70 / 1</text></g>
  <rect x="616" y="326" width="436" height="134" rx="12" fill="#fff9e9" stroke="#f0d38b"/>
  <text x="646" y="357" fill="#855b06" font-family="Arial, sans-serif" font-size="14" font-weight="700">Orientações de melhoria</text>
  <text x="646" y="384" fill="#6b5b32" font-family="Arial, sans-serif" font-size="12">• Investigue adesão e automedicação.</text>
  <text x="646" y="407" fill="#6b5b32" font-family="Arial, sans-serif" font-size="12">• Relacione comorbidades e riscos.</text>
  <text x="646" y="430" fill="#6b5b32" font-family="Arial, sans-serif" font-size="12">• Justifique as escolhas do MAI.</text>
  <rect x="616" y="482" width="436" height="80" rx="12" fill="#eef8f2" stroke="#bde5cd"/><text x="646" y="515" fill="#19734b" font-family="Arial, sans-serif" font-size="14" font-weight="700">Feedback liberado pelo docente</text><text x="646" y="538" fill="#4a6e5b" font-family="Arial, sans-serif" font-size="12">Consulte também a conversa completa e o MAI.</text>
  <text x="600" y="686" text-anchor="middle" fill="#60738e" font-family="Arial, sans-serif" font-size="12">Representação da tela do sistema • disponível após a liberação do feedback</text>
</svg>
