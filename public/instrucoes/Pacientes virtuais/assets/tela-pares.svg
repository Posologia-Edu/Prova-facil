<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Avaliação entre pares</title>
  <desc id="desc">Representação do formulário enviado por e-mail para avaliação individual dos colegas do grupo.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#243b5a" flood-opacity=".2"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#e8eef6"/>
  <rect x="264" y="42" width="672" height="612" rx="18" fill="#fff" filter="url(#shadow)"/>
  <circle cx="600" cy="102" r="28" fill="#0d2b58"/><path d="M586 102h28M600 88v28" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="160" text-anchor="middle" fill="#0b1d3a" font-family="Arial, sans-serif" font-size="23" font-weight="700">Avaliação entre pares</text>
  <text x="600" y="188" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Olá, Camila! Avalie a participação dos colegas no atendimento.</text>
  <rect x="306" y="222" width="588" height="154" rx="12" fill="#f6f8fb" stroke="#e0e7f0"/>
  <text x="334" y="253" fill="#1e334f" font-family="Arial, sans-serif" font-size="16" font-weight="700">Rafael Souza</text>
  <text x="334" y="276" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Participação ativa</text>
  <text x="334" y="296" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Fez perguntas relevantes e se engajou na anamnese.</text>
  <text x="334" y="329" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Nota de 0 a 5</text>
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle"><circle cx="508" cy="327" r="16" fill="#fff" stroke="#aab7c8"/><text x="508" y="331" fill="#52657e">0</text><circle cx="550" cy="327" r="16" fill="#fff" stroke="#aab7c8"/><text x="550" y="331" fill="#52657e">1</text><circle cx="592" cy="327" r="16" fill="#0d2b58"/><text x="592" y="331" fill="#fff">2</text><circle cx="634" cy="327" r="16" fill="#fff" stroke="#aab7c8"/><text x="634" y="331" fill="#52657e">3</text><circle cx="676" cy="327" r="16" fill="#fff" stroke="#aab7c8"/><text x="676" y="331" fill="#52657e">4</text><circle cx="718" cy="327" r="16" fill="#fff" stroke="#aab7c8"/><text x="718" y="331" fill="#52657e">5</text></g>
  <rect x="306" y="398" width="588" height="154" rx="12" fill="#f6f8fb" stroke="#e0e7f0"/>
  <text x="334" y="429" fill="#1e334f" font-family="Arial, sans-serif" font-size="16" font-weight="700">Marina Alves</text>
  <text x="334" y="452" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Contribuição técnica</text>
  <text x="334" y="472" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Contribuiu com o raciocínio farmacoterapêutico e o MAI.</text>
  <text x="334" y="505" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Nota de 0 a 5</text>
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle"><circle cx="508" cy="503" r="16" fill="#fff" stroke="#aab7c8"/><text x="508" y="507" fill="#52657e">0</text><circle cx="550" cy="503" r="16" fill="#fff" stroke="#aab7c8"/><text x="550" y="507" fill="#52657e">1</text><circle cx="592" cy="503" r="16" fill="#fff" stroke="#aab7c8"/><text x="592" y="507" fill="#52657e">2</text><circle cx="634" cy="503" r="16" fill="#fff" stroke="#aab7c8"/><text x="634" y="507" fill="#52657e">3</text><circle cx="676" cy="503" r="16" fill="#0d2b58"/><text x="676" y="507" fill="#fff">4</text><circle cx="718" cy="503" r="16" fill="#fff" stroke="#aab7c8"/><text x="718" y="507" fill="#52657e">5</text></g>
  <rect x="306" y="578" width="588" height="44" rx="9" fill="#0d2b58"/><text x="600" y="606" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Enviar avaliação</text>
  <text x="600" y="686" text-anchor="middle" fill="#60738e" font-family="Arial, sans-serif" font-size="12">Representação da tela do sistema • o link é pessoal e expira em 3 horas</text>
