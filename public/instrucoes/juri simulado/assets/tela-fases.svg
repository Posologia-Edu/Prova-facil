<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fases e cronômetro da sessão</title>
  <desc id="desc">Representação do painel de fases com cronômetro e sequência do júri simulado.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#14213d" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#e4ebf4"/><rect x="86" y="36" width="1028" height="628" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="132" y="86" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Sessão em andamento</text><rect x="862" y="58" width="206" height="34" rx="17" fill="#fff3d7"/><text x="965" y="80" text-anchor="middle" fill="#855b06" font-family="Arial,sans-serif" font-size="12" font-weight="700">Fase atual: Fala da Defesa</text>
  <rect x="132" y="124" width="936" height="174" rx="14" fill="#0b1d3a"/><text x="600" y="163" text-anchor="middle" fill="#c6d7ef" font-family="Arial,sans-serif" font-size="12" font-weight="700">FALA DA DEFESA</text><text x="600" y="238" text-anchor="middle" fill="#fff" font-family="monospace" font-size="72" font-weight="700">04:12</text><text x="600" y="273" text-anchor="middle" fill="#a8bddb" font-family="Arial,sans-serif" font-size="12">O juiz controla o tempo e avisa a mudança de fase.</text>
  <text x="132" y="346" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Fases da sessão</text>
  <g font-family="Arial,sans-serif" font-size="12" text-anchor="middle"><rect x="132" y="374" width="136" height="42" rx="8" fill="#e6eef8"/><text x="200" y="400" fill="#1d4b85" font-weight="700">1. Anúncio · 2 min</text><rect x="282" y="374" width="152" height="42" rx="8" fill="#0d2b58"/><text x="358" y="400" fill="#fff" font-weight="700">2. Defesa · 5 min</text><rect x="448" y="374" width="166" height="42" rx="8" fill="#f0f4f9"/><text x="531" y="400" fill="#48617f" font-weight="700">3. Acusação · 5 min</text><rect x="628" y="374" width="176" height="42" rx="8" fill="#f0f4f9"/><text x="716" y="400" fill="#48617f" font-weight="700">4. Perguntas · 5 min</text><rect x="818" y="374" width="150" height="42" rx="8" fill="#f0f4f9"/><text x="893" y="400" fill="#48617f" font-weight="700">5. Deliberação · 5 min</text><rect x="982" y="374" width="86" height="42" rx="8" fill="#f0f4f9"/><text x="1025" y="400" fill="#48617f" font-weight="700">6. Veredito</text></g>
  <rect x="132" y="466" width="936" height="88" rx="12" fill="#eef8f2" stroke="#bfe6cf"/><text x="160" y="500" fill="#19734b" font-family="Arial,sans-serif" font-size="13" font-weight="700">Como participar nesta fase</text><text x="160" y="527" fill="#4a6e5b" font-family="Arial,sans-serif" font-size="13">A Defesa apresenta seus argumentos, usa evidências e pode acionar suas testemunhas técnicas.</text>
  <text x="600" y="687" text-anchor="middle" fill="#60738e" font-family="Arial,sans-serif" font-size="12">Representação da tela do sistema • o cronômetro orienta o ritmo do julgamento</text>
</svg>
