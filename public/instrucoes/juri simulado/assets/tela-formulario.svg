<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Formulário de atuação no júri simulado</title>
  <desc id="desc">Representação do formulário do papel do aluno com campos de resposta e botão de envio.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#1d3557" flood-opacity=".22"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#e6edf5"/><rect x="196" y="35" width="808" height="628" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="238" y="87" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="23" font-weight="700">Formulário — Acusação</text><rect x="808" y="63" width="150" height="30" rx="15" fill="#fff0ef"/><text x="883" y="83" text-anchor="middle" fill="#a83e3e" font-family="Arial,sans-serif" font-size="12" font-weight="700">Grupo 3 · Acusação</text>
  <text x="238" y="118" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Registre a linha argumentativa do seu grupo e envie uma única resposta.</text><line x1="238" y1="141" x2="962" y2="141" stroke="#e2e8f0"/>
  <text x="238" y="180" fill="#172b4d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Tese principal</text><rect x="238" y="192" width="724" height="58" rx="9" fill="#f8fafc" stroke="#cbd6e4"/><text x="260" y="226" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Descreva a conduta que o grupo defende...</text>
  <text x="238" y="288" fill="#172b4d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Evidências e diretrizes utilizadas</text><rect x="238" y="300" width="724" height="78" rx="9" fill="#f8fafc" stroke="#cbd6e4"/><text x="260" y="333" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Relacione o argumento aos documentos do processo.</text><text x="260" y="356" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Inclua referências clínicas quando aplicável.</text>
  <text x="238" y="416" fill="#172b4d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Pergunta para o lado adversário</text><rect x="238" y="428" width="724" height="58" rx="9" fill="#f8fafc" stroke="#cbd6e4"/><text x="260" y="462" fill="#94a3b8" font-family="Arial,sans-serif" font-size="13">Prepare uma pergunta objetiva para o julgamento.</text>
  <rect x="238" y="530" width="724" height="50" rx="9" fill="#0d2b58"/><text x="600" y="561" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Enviar resposta</text>
  <text x="600" y="688" text-anchor="middle" fill="#60738e" font-family="Arial,sans-serif" font-size="12">Representação da tela do sistema • o formulário é configurado pelo professor</text>
</svg>
