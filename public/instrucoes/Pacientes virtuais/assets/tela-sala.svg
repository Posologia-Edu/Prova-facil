  <text x="300" y="177" fill="#65758b" font-family="Arial, sans-serif" font-size="11" font-weight="700">PACIENTE VIRTUAL • 1º ENCONTRO</text>
  <text x="300" y="200" fill="#263a57" font-family="Arial, sans-serif" font-size="14">Olá, doutor(a). Tenho sentido uma dor que não melhora...</text>
  <rect x="602" y="253" width="500" height="70" rx="12" fill="#0d2b58"/>
  <text x="625" y="280" fill="#c8d8ee" font-family="Arial, sans-serif" font-size="11" font-weight="700">VOCÊ • FARMACÊUTICO(A)</text>
  <text x="625" y="304" fill="#fff" font-family="Arial, sans-serif" font-size="14">Pode me contar quando essa dor começou?</text>
