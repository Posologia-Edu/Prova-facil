  <text x="300" y="384" fill="#65758b" font-family="Arial, sans-serif" font-size="11" font-weight="700">PACIENTE VIRTUAL</text>
  <text x="300" y="408" fill="#263a57" font-family="Arial, sans-serif" font-size="14">Começou há alguns meses. Às vezes piora à noite.</text>
