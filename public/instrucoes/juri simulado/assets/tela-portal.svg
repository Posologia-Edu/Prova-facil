<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Portal do aluno do júri simulado</title>
  <desc id="desc">Representação do portal com nome do júri, grupo, papel e processo selecionado.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#14213d" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#e4ebf4"/><rect x="35" y="34" width="1130" height="632" rx="18" fill="#fff" filter="url(#shadow)"/>
  <rect x="35" y="34" width="1130" height="86" rx="18" fill="#0b1d3a"/><circle cx="83" cy="77" r="24" fill="#e5a31b"/><path d="M83 62v30M68 77h30" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="123" y="70" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Júri Simulado — Farmacologia</text><text x="123" y="94" fill="#b8c9e2" font-family="Arial,sans-serif" font-size="12">Portal do aluno</text>
  <text x="78" y="164" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Caso clínico 01</text><text x="78" y="191" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Decisão farmacoterapêutica em paciente de risco</text>
  <rect x="78" y="220" width="300" height="84" rx="12" fill="#eef4fb" stroke="#cbd9eb"/><text x="100" y="248" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-weight="700">SEU GRUPO</text><text x="100" y="277" fill="#1d4b85" font-family="Arial,sans-serif" font-size="18" font-weight="700">Grupo 3</text><text x="250" y="277" fill="#1d4b85" font-family="Arial,sans-serif" font-size="13">3 integrantes</text>
  <rect x="398" y="220" width="300" height="84" rx="12" fill="#fff3d7" stroke="#efd58e"/><text x="420" y="248" fill="#855b06" font-family="Arial,sans-serif" font-size="11" font-weight="700">PAPEL NESTE PROCESSO</text><text x="420" y="277" fill="#a13f3f" font-family="Arial,sans-serif" font-size="18" font-weight="700">Acusação</text>
  <rect x="718" y="220" width="320" height="84" rx="12" fill="#eaf7f0" stroke="#bfe6cf"/><text x="740" y="248" fill="#19734b" font-family="Arial,sans-serif" font-size="11" font-weight="700">STATUS</text><circle cx="750" cy="276" r="6" fill="#31a66c"/><text x="766" y="281" fill="#19734b" font-family="Arial,sans-serif" font-size="15" font-weight="700">Aguardando início</text>
  <text x="78" y="360" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="16" font-weight="700">Processos do júri</text>
  <rect x="78" y="382" width="960" height="86" rx="12" fill="#0d2b58"/><text x="108" y="416" fill="#b9cbe5" font-family="Arial,sans-serif" font-size="11" font-weight="700">PROCESSO 01</text><text x="108" y="444" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700">Decisão farmacoterapêutica em paciente de risco</text><rect x="886" y="410" width="120" height="30" rx="15" fill="#fff" opacity=".14"/><text x="946" y="430" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="11" font-weight="700">Em pauta</text>
  <rect x="78" y="486" width="960" height="70" rx="12" fill="#f6f8fb" stroke="#dfe7f1"/><text x="108" y="516" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-weight="700">PROCESSO 02</text><text x="108" y="540" fill="#334b6b" font-family="Arial,sans-serif" font-size="14">Uso seguro de medicamentos em paciente idoso</text><text x="948" y="528" text-anchor="middle" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">Aguardando</text>
  <text x="600" y="686" text-anchor="middle" fill="#60738e" font-family="Arial,sans-serif" font-size="12">Representação da tela do sistema • o papel pode mudar em cada processo</text>
</svg>
