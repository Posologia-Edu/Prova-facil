    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14213d" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#dfe8f3"/>
