
<title>Projeto de Interface Posologia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: à esquerda o índice de módulos com o estado de aprovação; à direita o módulo dentro de uma moldura de aplicativo, com a barra de decisão logo abaixo. */
/* Tokens: Marinho + Âmbar, Fraunces (títulos e números), Geist (interface), Geist Mono (rótulos e dados). */
:root {
  --paper: #F3F5F9; --surface: #FFFFFF; --sunken: #EAEEF4; --raised: #FFFFFF;
  --ink: #0F1B2D; --ink-2: #4B586B; --ink-3: #7A8696;
  --line: #E1E6ED; --line-strong: #CBD3DE;
  --brand: #14284B; --brand-ink: #FFFFFF; --brand-soft: #E6ECF7; --brand-text: #14284B;
  --accent: #F2A516; --accent-ink: #8A5A00; --accent-soft: #FFF3D9;
  --ok: #1B8A5A; --ok-soft: #E2F4EB;
  --warn: #A66A00; --warn-soft: #FFF1D6;
  --bad: #C2372D; --bad-soft: #FBE7E5;
  --info: #2D63C8; --info-soft: #E5EEFC;
  --sb-bg: #0F2142; --sb-ink: #AEBBD3; --sb-on: #FFFFFF; --sb-hover: rgba(255,255,255,.06); --sb-active: rgba(255,255,255,.10); --sb-line: rgba(255,255,255,.08);
  --shadow-1: 0 1px 2px rgba(15,27,45,.06), 0 1px 1px rgba(15,27,45,.04);
  --shadow-2: 0 4px 14px rgba(15,27,45,.08), 0 1px 3px rgba(15,27,45,.06);
  --shadow-3: 0 24px 56px rgba(15,27,45,.16), 0 4px 12px rgba(15,27,45,.08);
  --f-display: "Fraunces", Georgia, serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --r-ctl: 8px; --r-card: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0A111F; --surface: #111B2E; --sunken: #0D1626; --raised: #162238;
    --ink: #E9EEF6; --ink-2: #A8B3C4; --ink-3: #75839A;
    --line: #1E2B43; --line-strong: #2C3C5A;
    --brand: #F2A516; --brand-ink: #1A1200; --brand-soft: #1B2A47; --brand-text: #CFE0FF;
    --accent: #F2A516; --accent-ink: #F7C25A; --accent-soft: #2A2110;
    --ok: #4CC38A; --ok-soft: #12291F; --warn: #F0B34A; --warn-soft: #2A2110; --bad: #F07A70; --bad-soft: #301816; --info: #7FA8F5; --info-soft: #14243F;
    --sb-bg: #0C1526; --sb-ink: #8E9DB6;
    --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 6px 18px rgba(0,0,0,.4); --shadow-3: 0 24px 56px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0A111F; --surface: #111B2E; --sunken: #0D1626; --raised: #162238;
  --ink: #E9EEF6; --ink-2: #A8B3C4; --ink-3: #75839A;
  --line: #1E2B43; --line-strong: #2C3C5A;
  --brand: #F2A516; --brand-ink: #1A1200; --brand-soft: #1B2A47; --brand-text: #CFE0FF;
  --accent: #F2A516; --accent-ink: #F7C25A; --accent-soft: #2A2110;
  --ok: #4CC38A; --ok-soft: #12291F; --warn: #F0B34A; --warn-soft: #2A2110; --bad: #F07A70; --bad-soft: #301816; --info: #7FA8F5; --info-soft: #14243F;
  --sb-bg: #0C1526; --sb-ink: #8E9DB6;
  --shadow-1: 0 1px 2px rgba(0,0,0,.4); --shadow-2: 0 6px 18px rgba(0,0,0,.4); --shadow-3: 0 24px 56px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p { margin: 0; text-wrap: balance; }
p { text-wrap: pretty; }
button { font: inherit; color: inherit; }
.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.sm { width: 15px; height: 15px; } .i.lg { width: 22px; height: 22px; }

/* ───────── moldura do projeto ───────── */
.project { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 40px; max-width: 1440px; margin: 0 auto; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { position: sticky; top: 20px; align-self: start; max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 6px; }
.rail .mark { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.rail h1 { font: 500 22px/1.15 var(--f-display); letter-spacing: -.01em; margin-bottom: 14px; }
.meter { margin-bottom: 18px; }
.meter .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.meter .bar { height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; display: flex; }
.meter .bar i { display: block; height: 100%; }
.rail .gt { font: 500 10.5px/1 var(--f-mono); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 6px; padding-left: 10px; }
.rail a.mod { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink-2); font-size: 13.5px; padding: 7px 10px; border-radius: var(--r-ctl); transition: background .15s, color .15s; }
.rail a.mod:hover { background: var(--sunken); color: var(--ink); }
.rail a.mod[aria-current="true"] { background: var(--surface); color: var(--ink); font-weight: 500; box-shadow: var(--shadow-1); border: 1px solid var(--line); padding: 6px 9px; }
.rail a.mod.next { opacity: .5; cursor: default; }
.tg { font: 500 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 99px; margin-left: 8px; background: var(--info-soft); color: var(--info); }
.tg.atualizado { background: var(--accent-soft); color: var(--accent-ink); }
.rail a.mod .tg + .st { margin-left: auto; }
.st { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; margin-left: auto; }
.st.aprovado { background: var(--ok); border-color: var(--ok); }
.st.ajustar { background: var(--accent); border-color: var(--accent); }
.rail .th { margin-top: 22px; }
.seg { display: inline-flex; background: var(--sunken); padding: 3px; border-radius: 10px; gap: 2px; }
.seg button { font: 500 12.5px var(--f-body); border: 0; background: transparent; color: var(--ink-2); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.stage { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.stage-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.stage-h .eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); }
.stage-h h2 { font: 500 clamp(26px, 3vw, 36px)/1.1 var(--f-display); letter-spacing: -.015em; margin: 8px 0 6px; }
.stage-h .route { font: 400 12px var(--f-mono); color: var(--ink-3); }
.changes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.changes div { font-size: 13.5px; color: var(--ink-2); padding-left: 12px; border-left: 2px solid var(--accent); }
.changes b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 1px; }
.viewport { overflow-x: auto; border-radius: 18px; box-shadow: var(--shadow-3); border: 1px solid var(--line-strong); background: var(--paper); }
.canvas { min-width: 1040px; }

.decide { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; padding: 18px 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-1); }
.decide .q b { display: block; font: 500 17px/1.3 var(--f-display); }
.decide .q span { font-size: 13px; color: var(--ink-2); }
.decide .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.decide textarea { grid-column: 1 / -1; width: 100%; font: 400 14px/1.5 var(--f-body); padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--paper); color: var(--ink); resize: vertical; min-height: 64px; }
.decide textarea:focus { outline: none; border-color: var(--info); box-shadow: 0 0 0 3px var(--info-soft); }
.nav2 { display: flex; justify-content: space-between; gap: 12px; }

/* ───────── sistema de componentes (o que o aplicativo usará) ───────── */
.frame { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 640px; background: var(--paper); color: var(--ink); font-size: 14px; }
.frame.solo { grid-template-columns: minmax(0, 1fr); }
.sb { background: var(--sb-bg); color: var(--sb-ink); display: flex; flex-direction: column; padding: 18px 12px 14px; gap: 2px; }
.sb-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; color: var(--sb-on); }
.sb-logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(145deg, #F7B93B, #E39500); display: grid; place-items: center; color: #1A1200; font: 600 17px var(--f-display); }
.sb-brand b { font: 500 16px/1.1 var(--f-display); display: block; letter-spacing: -.005em; }
.sb-brand span { font-size: 11px; color: var(--sb-ink); }
.sb-g { font: 500 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: rgba(174,187,211,.55); padding: 16px 10px 6px; }
.sb a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: var(--sb-ink); text-decoration: none; font-size: 13.5px; position: relative; }
.sb a:hover { background: var(--sb-hover); color: var(--sb-on); }
.sb a.on { background: var(--sb-active); color: var(--sb-on); font-weight: 500; }
.sb a.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.sb a .n { margin-left: auto; font: 500 10.5px var(--f-mono); background: rgba(242,165,22,.18); color: #F7C25A; padding: 2px 6px; border-radius: 99px; }
.sb .sub a { padding-left: 39px; font-size: 13px; }
.sb-foot { margin-top: auto; border-top: 1px solid var(--sb-line); padding: 14px 8px 0; display: flex; gap: 10px; align-items: center; color: var(--sb-on); }
.sb-foot small { display: block; color: var(--sb-ink); font-size: 11px; }
.main { min-width: 0; display: flex; flex-direction: column; }
.tb { height: 60px; padding: 0 32px; display: flex; align-items: center; gap: 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.crumbs { font-size: 13px; color: var(--ink-3); display: flex; gap: 8px; align-items: center; }
.crumbs b { color: var(--ink); font-weight: 500; }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--sunken); border: 1px solid transparent; border-radius: 10px; padding: 7px 12px; width: 280px; color: var(--ink-3); font-size: 13px; }
.search kbd { margin-left: auto; font: 500 11px var(--f-mono); border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 5px; background: var(--surface); }
.ib { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); position: relative; border: 0; background: transparent; }
.ib:hover { background: var(--sunken); }
.ib .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); }
.pg { padding: 32px 36px 48px; display: flex; flex-direction: column; gap: 28px; }
.pg.tight { padding-top: 24px; gap: 20px; }
.ph { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.ph .ey { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent-ink); margin-bottom: 10px; }
.ph h1 { font: 500 34px/1.08 var(--f-display); letter-spacing: -.02em; font-variation-settings: "opsz" 144; }
.ph .sub { color: var(--ink-2); margin-top: 8px; max-width: 62ch; font-size: 14.5px; }
.ph .acts { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { font: 500 13.5px/1 var(--f-body); padding: 10px 15px; border-radius: var(--r-ctl); border: 1px solid transparent; cursor: pointer; transition: background .15s, box-shadow .15s, filter .15s, transform .1s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: var(--shadow-1); }
.btn.primary:hover { filter: brightness(1.12); box-shadow: var(--shadow-2); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.secondary:hover { background: var(--sunken); }
.btn.ghost { background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.ai { background: linear-gradient(135deg, #F7B93B, #E89A06); color: #1A1200; box-shadow: var(--shadow-1); }
.btn.ai:hover { filter: brightness(1.05); box-shadow: var(--shadow-2); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.danger { background: var(--surface); color: var(--bad); border-color: var(--line-strong); }
.btn.sm { padding: 7px 11px; font-size: 12.5px; }
.btn.lg { padding: 13px 20px; font-size: 14.5px; }
.btn:focus-visible, .rail a:focus-visible, .seg button:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--f-body); padding: 5px 10px; border-radius: 999px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.info { background: var(--info-soft); color: var(--info); }
.pill.brand { background: var(--brand-soft); color: var(--brand-text); } .pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.pill.line { background: transparent; border: 1px solid var(--line-strong); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-1); min-width: 0; }
.card.flat { box-shadow: none; }
.card.hov { transition: box-shadow .2s, transform .2s, border-color .2s; }
.card.hov:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); border-color: var(--line-strong); }
.card-h { padding: 18px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.card-h h3 { font: 600 15px/1.3 var(--f-body); }
.card-h .s { font-size: 12.5px; color: var(--ink-3); }
.card-b { padding: 22px; }
.card-f { padding: 14px 22px; border-top: 1px solid var(--line); background: var(--sunken); border-radius: 0 0 var(--r-card) var(--r-card); display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 13px; color: var(--ink-2); }
.sec-t { font: 500 20px/1.2 var(--f-display); letter-spacing: -.005em; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-t a { font: 500 13px var(--f-body); color: var(--info); text-decoration: none; }
.lbl { font: 500 10.5px/1 var(--f-mono); letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpi { padding: 20px 22px; }
.kpi .v { font: 500 38px/1 var(--f-display); letter-spacing: -.02em; margin: 12px 0 8px; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.kpi .d.up { color: var(--ok); } .kpi .d.down { color: var(--bad); }
.spark { width: 100%; height: 34px; margin-top: 10px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 14px; font-size: 13.5px; color: var(--ink-2); text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.tabs a.on { color: var(--ink); font-weight: 500; border-color: var(--accent); }
.tabs a .c { font: 500 11px var(--f-mono); color: var(--ink-3); background: var(--sunken); padding: 2px 6px; border-radius: 99px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 500 12.5px var(--f-body); padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
.chip.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.input, .tbl td, .bub, .card p { overflow-wrap: anywhere; }
.input { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface); padding: 9px 12px; color: var(--ink-3); font-size: 13.5px; min-width: 0; }
.input.val { color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 12.5px; font-weight: 500; color: var(--ink); }
.field .hint { font-size: 12px; color: var(--ink-3); }
.field .ta { min-height: 88px; align-items: flex-start; line-height: 1.5; }

table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font: 500 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); padding: 12px 22px; border-bottom: 1px solid var(--line); background: var(--sunken); }
.tbl td { padding: 14px 22px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: var(--sunken); }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
.tbl th.n { text-align: right; }
.tbl .strong { font-weight: 500; }

.av { width: 34px; height: 34px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-text); display: inline-grid; place-items: center; font: 500 13px var(--f-display); flex: none; }
.av.lg { width: 48px; height: 48px; font-size: 18px; } .av.xl { width: 64px; height: 64px; font-size: 24px; } .av.sm { width: 26px; height: 26px; font-size: 11px; }
.av.a { background: var(--accent-soft); color: var(--accent-ink); } .av.g { background: var(--ok-soft); color: var(--ok); } .av.r { background: var(--bad-soft); color: var(--bad); } .av.i { background: var(--info-soft); color: var(--info); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who b { font-weight: 500; display: block; } .who span { font-size: 12.5px; color: var(--ink-3); display: block; }
.prog { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prog.ok i { background: var(--ok); } .prog.brand i { background: var(--brand); }
.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); } .ring .t { fill: none; stroke: var(--sunken); } .ring .v { fill: none; stroke: var(--accent); stroke-linecap: round; }
.ring.ok .v { stroke: var(--ok); }
.ring b { position: absolute; font: 500 20px var(--f-display); font-variant-numeric: tabular-nums; }

.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; font-size: 13.5px; background: var(--info-soft); color: var(--ink); }
.callout .i { color: var(--info); margin-top: 1px; }
.callout.warn { background: var(--warn-soft); } .callout.warn .i { color: var(--warn); }
.callout.ok { background: var(--ok-soft); } .callout.ok .i { color: var(--ok); }
.callout.bad { background: var(--bad-soft); } .callout.bad .i { color: var(--bad); }
.callout b { font-weight: 600; }

.g2, .g3, .g4, .g21, .g12 { display: grid; gap: 20px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } .g12 { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.row { display: flex; align-items: center; gap: 12px; } .row.top { align-items: flex-start; } .row.wrap { flex-wrap: wrap; } .sp { justify-content: space-between; } .end { justify-content: flex-end; }
.col { display: flex; flex-direction: column; } .g8 { gap: 8px; } .g12p { gap: 12px; } .g16 { gap: 16px; } .g24 { gap: 24px; }

  var NEXT = [];

  function sidebar(active) {
    var h = '<aside class="sb"><div class="sb-brand"><div class="sb-logo">P</div><div><b>Posologia Edu</b><span>Plataforma de avaliação</span></div></div>';

        h += '<a href="#" class="' + (it[0] === active ? "on" : "") + '" onclick="return false">' + ic(it[2]) + it[1] + "</a>";
        if (it[3] && it[0] === active) { h += '<div class="sub">'; it[3].forEach(function (s) { h += '<a href="#" onclick="return false">' + s[0] + "</a>"; }); h += "</div>"; }
      });
    });
    h += '<div class="sb-foot"><span class="av a">SF</span><div><b style="font-weight:500">Sérgio Fernandes</b><small>Docente · Plano Pro</small></div></div></aside>';

  function topbar(crumbs) {

  }
  function frameFor(m, body) {
    if (m.chrome === "aluno" || m.chrome === "bare") return '<div class="frame solo">' + body + "</div>";
    return '<div class="frame">' + sidebar(m.a) + '<div class="main">' + topbar(m.crumbs) + body + "</div></div>";
  }

  /* ───────── interface do projeto ───────── */
  function renderRail() {
    var h = "";
    GROUPS.forEach(function (g) {
      h += '<div class="grp"><div class="gt">' + g.g + "</div>";
      g.items.forEach(function (m) {
        h += '<a class="mod" href="#' + m.id + '" data-id="' + m.id + '" aria-current="' + (current && current.id === m.id) + '">' + m.t + (TAG[m.id] ? '<span class="tg ' + TAG[m.id] + '">' + TAG[m.id] + "</span>" : "") + '<span class="st ' + (status[m.id] ? status[m.id].s : "") + '"></span></a>';
      });
      h += "</div>";
    });
    if (NEXT.length) { h += '<div class="grp"><div class="gt">Próximos lotes</div>'; NEXT.forEach(function (n) { h += '<a class="mod next">' + n + "</a>"; }); h += "</div>"; }
    $("modlist").innerHTML = h;
    var ok = 0, aj = 0; FLAT.forEach(function (m) { var s = status[m.id]; if (s && s.s === "aprovado") ok++; else if (s && s.s === "ajustar") aj++; });
    var tot = FLAT.length;
    $("meter").innerHTML = '<div class="t"><span>' + ok + " de " + tot + ' aprovados</span><span>' + aj + ' com ajustes</span></div><div class="bar"><i style="width:' + (ok / tot * 100) + '%;background:var(--ok)"></i><i style="width:' + (aj / tot * 100) + '%;background:var(--accent)"></i></div>';
  }
  function renderDecision() {
    var s = status[current.id];
    $("d-status").textContent = !s ? "Sem decisão ainda." : s.s === "aprovado" ? "Aprovado" + (s.n ? " · " + s.n : "") : "Ajuste pedido" + (s.n ? " · " + s.n : "");
    $("d-note").value = s && s.n ? s.n : "";
  }
  function show(id) {
    var idx = FLAT.findIndex(function (m) { return m.id === id; });
    if (idx < 0) { idx = 0; }
    var m = FLAT[idx]; current = m;
    $("s-eyebrow").textContent = m.g + (TAG[m.id] ? " · " + ({ novo: "tela nova neste lote", atualizado: "reescrita a partir das suas observações", completo: "refeito a partir do inventário do código", v1: "versão simplificada (ainda será refeita)" }[TAG[m.id]]) : "");
    $("s-title").textContent = m.t;
    $("s-route").textContent = "Tela atual: " + m.r;
    $("s-changes").innerHTML = m.m.map(function (c) { return "<div><b>" + c[0] + "</b>" + c[1] + "</div>"; }).join("");
    $("s-cov").innerHTML = m.c ? '<span class="lbl">Mantido do sistema atual</span>' + m.c.map(function (x) { return '<span class="c">' + x + "</span>"; }).join("") : "";
    $("b-prev").disabled = idx === 0; $("b-next").disabled = idx === FLAT.length - 1;
    renderRail(); renderDecision();
    var put = function (html) { if (current === m) $("canvas").innerHTML = frameFor(m, html); };
    if (cache[m.id]) { put(cache[m.id]); return; }
    $("canvas").innerHTML = '<div class="loading">Carregando…</div>';
    fetch("modules/" + m.id + ".html").then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(function (t) { cache[m.id] = t; put(t); })
      .catch(function () { if (current === m) $("canvas").innerHTML = '<div class="loading">Não consegui carregar este módulo.</div>'; });
  }
  function go(i) { if (i >= 0 && i < FLAT.length) { location.hash = FLAT[i].id; } }
  function save(s) {
    var rec = { s: s, n: $("d-note").value.trim(), em: new Date().toISOString() };
    status[current.id] = rec; renderRail(); renderDecision();
    try { localStorage.setItem("pj-" + current.id, JSON.stringify(rec)); } catch (e) {}
    if (coll) coll.doc(current.id).set({ modulo: current.id, titulo: current.t, status: s, nota: rec.n, em: rec.em }).catch(function () {});
  }
  $("canvas").addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-tab]");
    if (!a) return;
    e.preventDefault();
    var root = a.closest("[data-tabs]"); if (!root) return;
    var key = a.getAttribute("data-tab");
    var own = function (sel) { return Array.prototype.filter.call(root.querySelectorAll(sel), function (n) { return n.closest("[data-tabs]") === root; }); };
    own("a[data-tab]").forEach(function (x) { x.classList.toggle("on", x === a); });
    own("[data-pane]").forEach(function (p) { p.classList.toggle("on", p.getAttribute("data-pane") === key); });
  });
  $("b-ok").addEventListener("click", function () { save("aprovado"); });
  $("b-adj").addEventListener("click", function () { save("ajustar"); });
  $("b-prev").addEventListener("click", function () { go(FLAT.indexOf(current) - 1); });
  $("b-next").addEventListener("click", function () { go(FLAT.indexOf(current) + 1); });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });

  /* tema da prévia */
  var root = document.documentElement, bl = $("t-light"), bd = $("t-dark");
  function cur() { var t = root.getAttribute("data-theme"); return t || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
  function sync() { bl.setAttribute("aria-pressed", cur() === "light"); bd.setAttribute("aria-pressed", cur() === "dark"); }
  function setT(t) { root.setAttribute("data-theme", t); try { localStorage.setItem("pj-tema", t); } catch (e) {} sync(); }
  try { var th = localStorage.getItem("pj-tema"); if (th === "light" || th === "dark") root.setAttribute("data-theme", th); } catch (e) {}
  bl.addEventListener("click", function () { setT("light"); }); bd.addEventListener("click", function () { setT("dark"); }); sync();

  /* decisões guardadas (db quando disponível; navegador como reserva) */
  FLAT.forEach(function (m) { try { var v = localStorage.getItem("pj-" + m.id); if (v) status[m.id] = JSON.parse(v); } catch (e) {} });
  show(location.hash.slice(1) || FLAT[0].id);
  if (window.claude && claude.use) {
    claude.use("db").then(function (db) {
      if (!db) return;
      coll = db.collection("aprovacoes");
      coll.onSnapshot(function (snap) {
        var have = {};
        snap.docs.forEach(function (d) { var x = d.data(); if (x && x.status) { have[d.id] = 1; status[d.id] = { s: x.status, n: x.nota || "", em: x.em }; } });
        FLAT.forEach(function (m) { if (!have[m.id] && status[m.id]) { delete status[m.id]; try { localStorage.removeItem("pj-" + m.id); } catch (e) {} } });
        renderRail(); if (current) renderDecision();
      }, function () {});
    }).catch(function () {});
  }
})();
