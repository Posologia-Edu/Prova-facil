<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Leitura do processo no júri simulado</title>
  <desc id="desc">Representação do processo com autos, número, resumo e abas de processo, personagens e formulário.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14213d" flood-opacity=".18"/></filter></defs>
  <rect width="1200" height="700" rx="28" fill="#e5ebf3"/><rect x="86" y="36" width="1028" height="628" rx="18" fill="#fff" filter="url(#shadow)"/>
  <text x="132" y="84" fill="#64748b" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">AUTOS DO PROCESSO</text><text x="1020" y="84" text-anchor="end" fill="#64748b" font-family="Arial,sans-serif" font-size="12">Nº 001</text><line x1="132" y1="103" x2="1068" y2="103" stroke="#dfe7f1"/>
  <text x="132" y="144" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="23" font-weight="700">Decisão farmacoterapêutica em paciente de risco</text><text x="132" y="172" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Leia o processo completo antes de construir sua atuação.</text>
  <rect x="132" y="206" width="936" height="48" rx="9" fill="#f0f4f9"/><rect x="132" y="206" width="150" height="48" rx="9" fill="#0d2b58"/><text x="207" y="236" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="13" font-weight="700">Processo</text><text x="438" y="236" text-anchor="middle" fill="#48617f" font-family="Arial,sans-serif" font-size="13" font-weight="700">Personagens</text><text x="730" y="236" text-anchor="middle" fill="#48617f" font-family="Arial,sans-serif" font-size="13" font-weight="700">Formulário</text>
  <rect x="132" y="285" width="600" height="245" rx="12" fill="#fbfcfe" stroke="#dfe7f1"/><text x="160" y="318" fill="#1d4b85" font-family="Arial,sans-serif" font-size="12" font-weight="700">RESUMO DO CASO</text><text x="160" y="352" fill="#334b6b" font-family="Arial,sans-serif" font-size="14">Paciente com múltiplas condições clínicas,</text><text x="160" y="378" fill="#334b6b" font-family="Arial,sans-serif" font-size="14">polifarmácia e um problema relacionado ao uso</text><text x="160" y="404" fill="#334b6b" font-family="Arial,sans-serif" font-size="14">de medicamentos. Analise a linha do tempo,</text><text x="160" y="430" fill="#334b6b" font-family="Arial,sans-serif" font-size="14">exames, condutas e evidências do processo.</text><line x1="160" y1="458" x2="696" y2="458" stroke="#e7edf5"/><text x="160" y="486" fill="#64748b" font-family="Arial,sans-serif" font-size="12">Tema central: a conduta adotada foi adequada?</text>
  <rect x="762" y="285" width="306" height="245" rx="12" fill="#fff8e5" stroke="#efd58e"/><text x="790" y="318" fill="#855b06" font-family="Arial,sans-serif" font-size="12" font-weight="700">ANTES DA SESSÃO</text><text x="790" y="352" fill="#6b5b32" font-family="Arial,sans-serif" font-size="13">✓ Estude o caso</text><text x="790" y="380" fill="#6b5b32" font-family="Arial,sans-serif" font-size="13">✓ Separe evidências</text><text x="790" y="408" fill="#6b5b32" font-family="Arial,sans-serif" font-size="13">✓ Organize argumentos</text><text x="790" y="436" fill="#6b5b32" font-family="Arial,sans-serif" font-size="13">✓ Prepare perguntas</text><text x="790" y="480" fill="#855b06" font-family="Arial,sans-serif" font-size="11">Personagens e formulários</text><text x="790" y="498" fill="#855b06" font-family="Arial,sans-serif" font-size="11">são liberados ao iniciar.</text>
  <text x="600" y="687" text-anchor="middle" fill="#60738e" font-family="Arial,sans-serif" font-size="12">Representação da tela do sistema • estude o processo antes do julgamento</text>
</svg>
