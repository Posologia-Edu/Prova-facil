  <circle cx="600" cy="96" r="27" fill="#0d2b58"/><path d="M586 96h28M600 82v28" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="600" y="150" text-anchor="middle" fill="#0b1d3a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Avaliação entre pares</text><text x="600" y="177" text-anchor="middle" fill="#64748b" font-family="Arial,sans-serif" font-size="13">Processo 01 · Acusação · link pessoal</text>
