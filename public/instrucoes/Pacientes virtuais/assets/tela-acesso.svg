<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Tela de acesso do aluno</title>
  <desc id="desc">Representação da tela em que o aluno informa o PIN da sala e o e-mail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset="1" stop-color="#132d5c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06132b" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#eef3fa"/>
  <rect width="1200" height="700" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="170" fill="#1f4788" opacity=".38"/>
  <circle cx="120" cy="620" r="220" fill="#d6911a" opacity=".14"/>
  <rect x="365" y="62" width="470" height="580" rx="22" fill="#fff" filter="url(#shadow)"/>
  <circle cx="600" cy="127" r="28" fill="#e9a51c"/>
  <path d="M600 111v32M584 127h32" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="195" text-anchor="middle" fill="#0b1d3a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Acesso do aluno</text>
  <text x="600" y="224" text-anchor="middle" fill="#64748b" font-family="Arial, sans-serif" font-size="14">Entre na sala virtual com os dados fornecidos pelo docente</text>
  <text x="410" y="274" fill="#172b4d" font-family="Arial, sans-serif" font-size="13" font-weight="700">E-mail institucional</text>
  <rect x="410" y="286" width="380" height="48" rx="9" fill="#f8fafc" stroke="#d4dce8"/>
  <circle cx="433" cy="310" r="8" fill="none" stroke="#718096" stroke-width="2"/>
  <path d="M428 318c3-6 7-6 10 0" fill="none" stroke="#718096" stroke-width="2"/>
  <text x="452" y="315" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">seu.nome@instituicao.edu.br</text>
  <text x="410" y="372" fill="#172b4d" font-family="Arial, sans-serif" font-size="13" font-weight="700">PIN da atividade</text>
  <rect x="410" y="384" width="380" height="48" rx="9" fill="#f8fafc" stroke="#d4dce8"/>
  <rect x="429" y="400" width="15" height="16" rx="3" fill="none" stroke="#718096" stroke-width="2"/>
  <path d="M432 400v-5c0-5 9-5 9 0v5" fill="none" stroke="#718096" stroke-width="2"/>
  <text x="458" y="414" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">ex.: ABC123</text>
  <rect x="410" y="452" width="380" height="48" rx="9" fill="#0d2b58"/>
  <text x="600" y="482" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="15" font-weight="700">Entrar na atividade</text>
  <rect x="408" y="535" width="384" height="52" rx="10" fill="#fff9e9" stroke="#f2d28b"/>
  <text x="429" y="557" fill="#855b06" font-family="Arial, sans-serif" font-size="12" font-weight="700">Dica</text>
  <text x="429" y="575" fill="#855b06" font-family="Arial, sans-serif" font-size="11">Use o mesmo e-mail cadastrado na turma.</text>
  <text x="600" y="675" text-anchor="middle" fill="#cbd8ec" font-family="Arial, sans-serif" font-size="12">Representação da tela do sistema • acesso por PIN</text>
</svg>
